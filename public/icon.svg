<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD043"/>
      <stop offset="50%" stop-color="#F2B01E"/>
      <stop offset="100%" stop-color="#C8880A"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#F2B01E" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Solar track guideline -->
  <path d="M 80 180 Q 256 120 432 180" fill="none" stroke="#F2B01E" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.4"/>
  <path d="M 64 340 Q 256 400 448 340" fill="none" stroke="#F2B01E" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Aerodynamic Pod Silhouette -->
  <path d="M 120 256 C 120 200 170 170 256 170 C 342 170 392 200 392 256 C 392 300 346 324 256 324 C 166 324 120 300 120 256 Z" fill="#141414" stroke="url(#goldGrad)" stroke-width="7"/>

  <!-- Window Canopy -->
  <path d="M 154 246 C 160 216 195 200 256 200 C 317 200 352 216 358 246 C 354 262 320 270 256 270 C 192 270 158 262 154 246 Z" fill="#0A0A0A" stroke="#F2B01E" stroke-width="3"/>

  <!-- Stylized Monogram / Arrow Peak inside (Solar A) -->
  <path d="M 256 140 L 290 220 L 222 220 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <circle cx="256" cy="245" r="7" fill="#F2B01E"/>

  <!-- Under-chassis solar energy beam -->
  <line x1="200" y1="340" x2="312" y2="340" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Brand Text -->
  <text x="256" y="420" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="9">RAILBUS</text>
  <text x="256" y="450" text-anchor="middle" fill="#F2B01E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="7">MEMBERS</text>
</svg>
